name: Keep servers awake

# Free Render services sleep after ~15 idle minutes; pinging keeps them
# responsive. BUT Render's free tier gives 750 instance-hours a MONTH shared
# across every free service on the account. The budget is split:
#   Noted API   03:00-17:59 UTC (08:30-23:29 IST)  ~465 h/month  (this file)
#   ShopNGo API 03:00-09:59 UTC (08:30-15:29 IST)  ~217 h/month  (keep-shopngo-awake.yml)
# Total ~682 of 750, with headroom for a future service. Outside its window
# a service just cold-starts (~50s) for the first visitor - nothing stops
# working.
#
# ADD a server:    add a curl line below AND rebalance the hour windows so
#                  the monthly total stays under 750.
# REMOVE a server: delete its curl line.
# PAUSE all pings: Actions tab -> this workflow -> "..." -> Disable workflow.
#
# GitHub cron is best effort: short intervals are sometimes delayed, so an
# occasional cold start can still happen. The app retries, so that is fine.

on:
  schedule:
    - cron: '*/10 3-17 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping servers
        run: |
          # Noted API (Render)
          curl -fsS -m 120 https://noted-api-orcm.onrender.com/health && echo "noted-api awake" || echo "noted-api ping failed (may be waking)"
